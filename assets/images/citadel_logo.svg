<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">
  <defs>
    <linearGradient id="citadelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Citadel Bastion / Hexagonal Core Icon -->
  <g transform="translate(12, 12)" filter="url(#subtleGlow)">
    <!-- Outer Fortress Hexagon -->
    <polygon points="34,2 64,19 64,51 34,68 4,51 4,19" fill="#F8FAFC" stroke="url(#citadelGrad)" stroke-width="4" stroke-linejoin="round" />
    <!-- Inner Aerodynamic Chevron -->
    <polygon points="34,14 52,24 52,44 34,54 16,44 16,24" fill="url(#citadelGrad)" fill-opacity="0.12" stroke="url(#citadelGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Center Vectors -->
    <path d="M 34,18 L 34,50 M 20,29 L 34,37 L 48,29" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34, 34" r="3.5" fill="#2563EB" />
  </g>

  <!-- Citadel Main Title -->
  <text x="96" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="#0F172A">CITADEL</text>
  
  <!-- Professional Subtitle -->
  <text x="98" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" font-size="11" font-weight="700" letter-spacing="2.8" fill="#2563EB">PRECISION ENGINEERING SYSTEMS</text>
</svg>
